<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Same brand stops the app uses everywhere (see .brand-gradient in globals.css). -->
  <defs>
    <linearGradient id="ig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9ce34" />
      <stop offset="45%" stop-color="#ee2a7b" />
      <stop offset="100%" stop-color="#6228d7" />
    </linearGradient>
  </defs>

  <!-- Gradient tile. Filled rather than outlined, because thin strokes turn
       to mud at 16px in a browser tab. -->
  <rect width="48" height="48" rx="12" fill="url(#ig)" />

  <!-- Camera glyph, drawn in white on top: rounded square, lens, flash dot. -->
  <g fill="none" stroke="#ffffff" stroke-width="3">
    <rect x="11.5" y="11.5" width="25" height="25" rx="7.5" />
    <circle cx="24" cy="24" r="6.5" />
  </g>
  <circle cx="32.6" cy="15.4" r="2" fill="#ffffff" />
</svg>
